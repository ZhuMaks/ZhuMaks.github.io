<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Про мене</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            max-width: 500px;
            margin: 80px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666666;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        p {
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 25px 0;
        }

        li {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        /* Стиль для посилань */
        a {
            color: #111111;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: color 0.2s;
        }

        a:hover {
            color: #0066cc;
        }

        .links {
            margin-top: 35px;
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
        }

        .links a {
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>Максим Жукотинський</h1>
    <div class="subtitle">Розробник / Студент</div>

    <p>
        Привіт. Я займаюся розробкою програмного забезпечення. Студент курсу Frontend with AI в SoftServe academy
    </p>

    <div class="links">
       <h2> <a href="https://github.com/ZhuMaks" target="_blank">GitHub</a> </h2>

    </div>

</body>
</html>
