<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ToDo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 todo-container">
            
            <h2 class="text-center mb-4">Мій ToDo List</h2>
            
            <div class="input-group mb-4">
                <input type="text" id="taskInput" class="form-control" placeholder="Що потрібно зробити?">
                <button class="btn btn-primary" id="addButton">ADD</button>
            </div>

            <fieldset>
                <legend class="fs-6 text-muted">Ваші завдання:</legend>
                <ul id="taskListUI" class="list-group">
                    </ul>
            </fieldset>

        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
